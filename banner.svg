<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a7bd5;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="#0d1117"/>
  
  <!-- Animated circles -->
  <circle cx="100" cy="100" r="80" fill="url(#grad1)" opacity="0.1">
    <animate attributeName="r" values="80;100;80" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="100" r="60" fill="url(#grad2)" opacity="0.1">
    <animate attributeName="r" values="60;80;60" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Grid pattern -->
  <g stroke="#667eea" stroke-width="0.5" opacity="0.2">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
  </g>
  
  <!-- Floating dots -->
  <circle cx="150" cy="60" r="3" fill="#667eea">
    <animate attributeName="cy" values="60;40;60" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="80" r="2" fill="#764ba2">
    <animate attributeName="cy" values="80;60;80" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="50" r="4" fill="#f093fb">
    <animate attributeName="cy" values="50;30;50" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="70" r="3" fill="#00d2ff">
    <animate attributeName="cy" values="70;50;70" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Main text -->
  <text x="400" y="85" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="bold" fill="url(#grad1)" filter="url(#glow)">
    Ankita Salaria
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="125" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#8b949e">
    CS Student • Kubernetes Enthusiast • Open Source Contributor
  </text>
  
  <!-- Tech icons -->
  <g transform="translate(280, 145)">
    <rect x="0" y="0" width="24" height="24" rx="4" fill="#00ADD8" opacity="0.8"/>
    <text x="12" y="16" text-anchor="middle" font-family="monospace" font-size="10" fill="white" font-weight="bold">Go</text>
    
    <rect x="35" y="0" width="24" height="24" rx="4" fill="#3776AB" opacity="0.8"/>
    <text x="47" y="16" text-anchor="middle" font-family="monospace" font-size="10" fill="white" font-weight="bold">Py</text>
    
    <rect x="70" y="0" width="24" height="24" rx="4" fill="#326CE5" opacity="0.8"/>
    <text x="82" y="16" text-anchor="middle" font-family="monospace" font-size="8" fill="white" font-weight="bold">K8s</text>
    
    <rect x="105" y="0" width="24" height="24" rx="4" fill="#2496ED" opacity="0.8"/>
    <text x="117" y="16" text-anchor="middle" font-family="monospace" font-size="8" fill="white" font-weight="bold">Dkr</text>
    
    <rect x="140" y="0" width="24" height="24" rx="4" fill="#E6522C" opacity="0.8"/>
    <text x="152" y="16" text-anchor="middle" font-family="monospace" font-size="7" fill="white" font-weight="bold">Prm</text>
  </g>
  
  <!-- Bottom accent line -->
  <rect x="300" y="175" width="200" height="2" fill="url(#grad1)" rx="1">
    <animate attributeName="width" values="200;300;200" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x" values="300;250;300" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
