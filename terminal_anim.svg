<svg width="600" height="280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <filter id="termGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="termClip">
      <rect x="10" y="40" width="580" height="220" rx="4"/>
    </clipPath>
  </defs>

  <rect width="600" height="280" rx="12" fill="url(#termBg)" stroke="#4A90D9" stroke-width="1.5" opacity="0.95"/>

  <!-- Terminal header -->
  <rect x="0" y="0" width="600" height="32" rx="12" fill="#161b22"/>
  <rect x="0" y="20" width="600" height="12" fill="#161b22"/>
  <circle cx="20" cy="16" r="6" fill="#E74C3C"/>
  <circle cx="40" cy="16" r="6" fill="#F39C12"/>
  <circle cx="60" cy="16" r="6" fill="#2ECC71"/>
  <text x="300" y="20" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="11">ankita@dev — zsh</text>

  <!-- Animated command lines (appearing one by one) -->
  <g clip-path="url(#termClip)">
    <!-- Line 1: whoami -->
    <text x="20" y="62" fill="#2ECC71" font-family="monospace" font-size="12" opacity="0">
      <tspan>$ </tspan><tspan fill="#4A90D9">whoami</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.5s" fill="freeze"/>
    </text>
    <text x="20" y="80" fill="#e0d4c8" font-family="monospace" font-size="12" opacity="0">
      Ankita Salaria — CS Student · Go &amp; Python
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="1.2s" fill="freeze"/>
    </text>

    <!-- Line 2: cat focus.txt -->
    <text x="20" y="106" fill="#2ECC71" font-family="monospace" font-size="12" opacity="0">
      <tspan>$ </tspan><tspan fill="#4A90D9">cat focus.txt</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="2.0s" fill="freeze"/>
    </text>
    <text x="20" y="124" fill="#e0d4c8" font-family="monospace" font-size="12" opacity="0">
      K8s tooling · CNCF/KubeArmor · GSoC 2027
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="2.7s" fill="freeze"/>
    </text>

    <!-- Line 3: git status -->
    <text x="20" y="150" fill="#2ECC71" font-family="monospace" font-size="12" opacity="0">
      <tspan>$ </tspan><tspan fill="#4A90D9">git status</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="3.5s" fill="freeze"/>
    </text>
    <text x="20" y="168" fill="#2ECC71" font-family="monospace" font-size="12" opacity="0">
      On branch: main · 2 PRs in review · CI: green ✅
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="4.2s" fill="freeze"/>
    </text>

    <!-- Line 4: echo status -->
    <text x="20" y="194" fill="#2ECC71" font-family="monospace" font-size="12" opacity="0">
      <tspan>$ </tspan><tspan fill="#4A90D9">echo $STATUS</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="5.0s" fill="freeze"/>
    </text>
    <text x="20" y="212" fill="#E74C3C" font-family="monospace" font-size="12" font-weight="bold" opacity="0">
      BUILDING · CONTRIBUTING · READY 🚀
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="5.7s" fill="freeze"/>
    </text>

    <!-- Blinking cursor on last line -->
    <rect x="20" y="228" width="8" height="14" fill="#4A90D9" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="6.0s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0;1" dur="1s" begin="6.0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="255" width="600" height="25" fill="#161b22"/>
  <text x="20" y="272" fill="#8B949E" font-family="monospace" font-size="10">ankita@dev:~$ █</text>
  <text x="580" y="272" text-anchor="end" fill="#2ECC71" font-family="monospace" font-size="10">● connected</text>
</svg>