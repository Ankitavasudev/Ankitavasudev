<svg width="800" height="160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="scratch">
      <feTurbulence type="turbulence" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
      <feBlend in="SourceGraphic" in2="mono" mode="multiply"/>
    </filter>
    <linearGradient id="rustBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#111111;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#080808;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rough black background -->
  <rect width="800" height="160" rx="4" fill="url(#rustBg)" filter="url(#rough)"/>

  <!-- Scratch lines (heavy) -->
  <g stroke="#333" stroke-width="0.5" opacity="0.4">
    <line x1="50" y1="20" x2="200" y2="140" />
    <line x1="300" y1="10" x2="450" y2="150" />
    <line x1="600" y1="30" x2="750" y2="130" />
    <line x1="100" y1="100" x2="350" y2="60" />
    <line x1="500" y1="50" x2="700" y2="120" />
    <line x1="0" y1="80" x2="250" y2="90" />
    <line x1="400" y1="0" x2="420" y2="160" />
    <line x1="150" y1="0" x2="180" y2="160" />
    <line x1="650" y1="0" x2="680" y2="160" />
    <line x1="0" y1="30" x2="800" y2="35" />
    <line x1="0" y1="90" x2="800" y2="85" />
    <line x1="0" y1="140" x2="800" y2="145" />
  </g>

  <!-- Rust spots -->
  <circle cx="120" cy="40" r="3" fill="#3a2a1a" opacity="0.5"/>
  <circle cx="400" cy="120" r="4" fill="#2a1a0a" opacity="0.4"/>
  <circle cx="650" cy="60" r="2.5" fill="#3a2a1a" opacity="0.5"/>
  <circle cx="300" cy="140" r="3.5" fill="#2a1a0a" opacity="0.4"/>
  <circle cx="50" cy="100" r="2" fill="#3a2a1a" opacity="0.6"/>
  <circle cx="700" cy="30" r="3" fill="#3a2a1a" opacity="0.5"/>
  <circle cx="200" cy="150" r="2.5" fill="#2a1a0a" opacity="0.4"/>

  <!-- Border (rough) -->
  <rect x="2" y="2" width="796" height="156" rx="4" fill="none" stroke="#2a2a2a" stroke-width="1" filter="url(#rough)"/>

  <!-- Main text: scratch hint -->
  <text x="400" y="65" text-anchor="middle" fill="#444" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="3">
    ▓▓▓ SCRATCH TO REVEAL ▓▓▓
  </text>

  <!-- Subtle peek of quote behind scratches (barely visible) -->
  <text x="400" y="95" text-anchor="middle" fill="#1a1a1a" font-family="monospace" font-size="11" font-style="italic">
    "I don't always test my code, but when I do, I do it in production."
  </text>

  <!-- Bottom hint -->
  <text x="400" y="135" text-anchor="middle" fill="#333" font-family="monospace" font-size="9">
    👆 scratch the black surface above to reveal the truth
  </text>

  <!-- Small animated glow spot -->
  <circle cx="400" cy="80" r="2" fill="#E74C3C" opacity="0.3">
    <animate attributeName="r" values="2;8;2" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>