<svg xmlns="http://www.w3.org/2000/svg" width="560" height="232" viewBox="0 0 560 232" role="img" aria-label="Animated terminal showing a small Go snippet for KubeArmor hardening">
  <defs>
    <clipPath id="win">
      <rect x="1" y="1" width="558" height="230" rx="14"/>
    </clipPath>
    <style>
      text {
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 14px;
      }
      .title {
        font-size: 12px;
        letter-spacing: 0.4px;
      }
      .num {
        font-size: 12px;
        fill: #7d4b66;
      }
      .line {
        opacity: 0;
        animation: lineIn 420ms cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }
      .d1 { animation-delay: 0.15s; }
      .d2 { animation-delay: 0.32s; }
      .d3 { animation-delay: 0.49s; }
      .d4 { animation-delay: 0.70s; }
      .d5 { animation-delay: 0.91s; }
      .d6 { animation-delay: 1.12s; }
      .d7 { animation-delay: 1.33s; }
      .cursor {
        opacity: 0;
        animation: blink 1.1s steps(1, end) 1.75s infinite;
      }
      @keyframes lineIn {
        from { opacity: 0; transform: translateX(-7px); }
        to   { opacity: 1; transform: translateX(0); }
      }
      @keyframes blink {
        0%, 45%   { opacity: 1; }
        46%, 100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .line, .cursor { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="558" height="230" rx="14" fill="#140a10" stroke="#4f264f" stroke-width="1.5"/>

  <g clip-path="url(#win)">
    <rect x="0" y="0" width="560" height="36" fill="#23121e"/>
    <line x1="0" y1="36" x2="560" y2="36" stroke="#4f264f" stroke-opacity="0.75"/>

    <circle cx="21" cy="18" r="5.5" fill="#ff5f56"/>
    <circle cx="39" cy="18" r="5.5" fill="#ffbd2e"/>
    <circle cx="57" cy="18" r="5.5" fill="#27c93f"/>

    <text class="title" x="280" y="22.5" text-anchor="middle" fill="#da97bd">ankita@kubearmor: ~/k8s</text>

    <g class="line d1">
      <text class="num" x="30" y="68" text-anchor="end">1</text>
      <text x="46" y="68" xml:space="preserve"><tspan fill="#ff98cc">package</tspan><tspan fill="#faf6fc"> main</tspan></text>
    </g>

    <g class="line d2">
      <text class="num" x="30" y="92" text-anchor="end">2</text>
    </g>

    <g class="line d3">
      <text class="num" x="30" y="116" text-anchor="end">3</text>
      <text x="46" y="116" xml:space="preserve"><tspan fill="#ff98cc">func</tspan><tspan fill="#f8b4d4"> main</tspan><tspan fill="#faf6fc">() {</tspan></text>
    </g>

    <g class="line d4">
      <text class="num" x="30" y="140" text-anchor="end">4</text>
      <text x="46" y="140" xml:space="preserve"><tspan fill="#faf6fc">    k8s </tspan><tspan fill="#ff98cc">:=</tspan><tspan fill="#f8b4d4"> NewCluster</tspan><tspan fill="#faf6fc">(</tspan><tspan fill="#ffd9ea">"prod"</tspan><tspan fill="#faf6fc">)</tspan></text>
    </g>

    <g class="line d5">
      <text class="num" x="30" y="164" text-anchor="end">5</text>
      <text x="46" y="164" xml:space="preserve"><tspan fill="#faf6fc">    k8s</tspan><tspan fill="#f8b4d4">.Harden</tspan><tspan fill="#faf6fc">()   </tspan><tspan fill="#c684a4" fill-opacity="0.85">// least privilege</tspan></text>
    </g>

    <g class="line d6">
      <text class="num" x="30" y="188" text-anchor="end">6</text>
      <text x="46" y="188" xml:space="preserve"><tspan fill="#faf6fc">    k8s</tspan><tspan fill="#f8b4d4">.Watch</tspan><tspan fill="#faf6fc">(ctx) </tspan><tspan fill="#c684a4" fill-opacity="0.85">// runtime security</tspan></text>
    </g>

    <g class="line d7">
      <text class="num" x="30" y="212" text-anchor="end">7</text>
      <text x="46" y="212" fill="#faf6fc">}</text>
    </g>

    <rect class="cursor" x="56" y="197" width="8" height="16" rx="2" fill="#ff98cc"/>
  </g>
</svg>
