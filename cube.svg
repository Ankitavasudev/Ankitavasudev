<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="faceGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="12" fill="#0d1117"/>

  <!-- 3D Cube using CSS-like transform via SVG groups -->
  <g transform="translate(150,150)">
    <!-- Back face -->
    <g opacity="0.3">
      <rect x="-60" y="-60" width="120" height="120" fill="#161b22" stroke="#30363d" stroke-width="1" transform="translate(0,0)"/>
    </g>

    <!-- Main visible face (front) -->
    <rect x="-60" y="-60" width="120" height="120" fill="url(#faceGrad1)" stroke="#58a6ff" stroke-width="1.5" rx="2"/>

    <!-- Grid lines on face -->
    <g stroke="rgba(88,166,255,0.1)" stroke-width="0.5">
      <line x1="-60" y1="-35" x2="60" y2="-35"/>
      <line x1="-60" y1="-10" x2="60" y2="-10"/>
      <line x1="-60" y1="15" x2="60" y2="15"/>
      <line x1="-60" y1="40" x2="60" y2="40"/>
      <line x1="-35" y1="-60" x2="-35" y2="60"/>
      <line x1="-10" y1="-60" x2="-10" y2="60"/>
      <line x1="15" y1="-60" x2="15" y2="60"/>
      <line x1="40" y1="-60" x2="40" y2="60"/>
    </g>

    <!-- Skill icon and text -->
    <text x="0" y="-15" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="28" filter="url(#glow1)">🐹</text>
    <text x="0" y="10" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="16" font-weight="bold" filter="url(#glow1)">Go</text>
    <text x="0" y="28" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">backend · systems</text>

    <!-- Rotating border highlight -->
    <rect x="-60" y="-60" width="120" height="120" fill="none" stroke="#58a6ff" stroke-width="1" stroke-dasharray="8 4" rx="2" opacity="0.5">
      <animate attributeName="stroke-dashoffset" from="0" to="24" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- Corner accents -->
    <circle cx="-55" cy="-55" r="3" fill="#58a6ff" opacity="0.6"/>
    <circle cx="55" cy="-55" r="3" fill="#bc8cff" opacity="0.6"/>
    <circle cx="-55" cy="55" r="3" fill="#3fb950" opacity="0.6"/>
    <circle cx="55" cy="55" r="3" fill="#f85149" opacity="0.6"/>
  </g>

  <!-- Orbit ring -->
  <circle cx="150" cy="150" r="100" fill="none" stroke="rgba(88,166,255,0.1)" stroke-width="1" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="0" to="24" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Orbiting dot -->
  <circle cx="150" cy="50" r="4" fill="#58a6ff" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Title -->
  <text x="150" y="285" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">hover to pause · skills in 3D</text>
</svg>